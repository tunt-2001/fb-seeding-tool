<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Seeding Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
    pre::-webkit-scrollbar { width: 6px; height: 6px; }
    pre::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex items-center justify-between pb-6 mb-6 border-b border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white p-3 rounded-xl shadow-lg shadow-blue-500/20">
          <i class="fa-brands fa-facebook text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">HỆ THỐNG SEEDING FACEBOOK (PRO)</h1>
          <p class="text-sm text-slate-400">Anti-detect Browser • Auto 2FA • Multi-thread Runner</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <span id="status-badge" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Sẵn sàng
        </span>
        <button id="btn-start" onclick="startCampaign()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-medium shadow-lg shadow-blue-600/30 flex items-center gap-2 transition">
          <i class="fa-solid fa-play"></i> BẮT ĐẦU CHẠY
        </button>
      </div>
    </header>

    <!-- Main Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Cột Trái: Quản lý Tài khoản & Kịch bản (7 Cột) -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Khối 1: Nhập danh sách Via -->
        <div class="glass-card rounded-2xl p-5 shadow-xl">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-semibold flex items-center gap-2 text-blue-400">
              <i class="fa-solid fa-users"></i> Danh sách Tài khoản (Via / Clone)
            </h2>
            <div class="space-x-2">
              <span id="acc-count" class="text-xs bg-slate-800 px-2.5 py-1 rounded-md text-slate-300">0 Tài khoản</span>
              <button onclick="clearAccounts()" class="text-xs text-rose-400 hover:text-rose-300 transition">Xóa hết</button>
            </div>
          </div>
          <p class="text-xs text-slate-400 mb-2">Định dạng chuẩn: <code>UID|Pass|2FA|Cookie|Proxy</code> (Mỗi tài khoản 1 dòng)</p>
          <textarea id="raw-via" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-blue-500 transition" placeholder="100089283748291|Pass123|JBSWY3DPEHPK3PXP||127.0.0.1:8080"></textarea>
          <div class="mt-3 flex justify-end">
            <button onclick="importAccounts()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-4 py-2 rounded-lg font-medium border border-slate-700 transition">
              <i class="fa-solid fa-file-import mr-1"></i> Nạp danh sách Nick
            </button>
          </div>
        </div>

        <!-- Khối 2: Cấu hình Kịch bản Seeding -->
        <div class="glass-card rounded-2xl p-5 shadow-xl space-y-4">
          <h2 class="text-lg font-semibold flex items-center gap-2 text-indigo-400">
            <i class="fa-solid fa-sliders"></i> Cấu hình Kịch bản & Chiến dịch
          </h2>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Link bài viết Facebook (Fanpage / Group)</label>
            <input type="text" id="target-url" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="https://www.facebook.com/.../posts/...">
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Số luồng (Threads)</label>
              <input type="number" id="threads" min="1" max="10" value="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Nghỉ giữa nick (Giây)</label>
              <div class="flex items-center space-x-1">
                <input type="number" id="min-delay" value="5" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-100">
                <span class="text-slate-500">-</span>
                <input type="number" id="max-delay" value="15" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-100">
              </div>
            </div>
            <div class="flex items-center pt-5">
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="enable-reaction" checked class="sr-only peer">
                <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                <span class="ml-2 text-xs font-medium text-slate-300">Tự động Thích</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Danh sách Comment (Mỗi dòng 1 câu ngẫu nhiên)</label>
            <textarea id="comments" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Mỗi câu bình luận trên một dòng..."></textarea>
          </div>

          <div class="flex justify-end">
            <button onclick="saveCampaign()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-lg font-medium shadow-md transition">
              <i class="fa-solid fa-floppy-disk mr-1"></i> Lưu Cấu Hình
            </button>
          </div>
        </div>

      </div>

      <!-- Cột Phải: Bảng điều khiển Thời gian thực (Live Logs & Status) (5 Cột) -->
      <div class="lg:col-span-5 space-y-6">
        <div class="glass-card rounded-2xl p-5 shadow-xl flex flex-col h-[650px]">
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
            <h2 class="text-lg font-semibold flex items-center gap-2 text-emerald-400">
              <i class="fa-solid fa-terminal"></i> Nhật ký Luồng (Live Logs)
            </h2>
            <button onclick="document.getElementById('log-box').innerText=''" class="text-xs text-slate-500 hover:text-slate-400">Clear</button>
          </div>
          <pre id="log-box" class="flex-1 bg-slate-950/80 rounded-xl p-4 font-mono text-xs text-emerald-400 overflow-y-auto leading-relaxed whitespace-pre-wrap select-all border border-slate-800/80"></pre>
        </div>
      </div>

    </div>
  </div>

  <script>
    async function loadAccounts() {
      const res = await fetch('/api/accounts');
      const data = await res.json();
      document.getElementById('acc-count').innerText = `${data.length} Tài khoản`;
    }

    async function importAccounts() {
      const rawText = document.getElementById('raw-via').value.trim();
      if (!rawText) return alert("Vui lòng dán danh sách Via!");
      const res = await fetch('/api/accounts/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raw_text: rawText })
      });
      const data = await res.json();
      alert(`Đã nạp thành công ${data.imported} tài khoản!`);
      document.getElementById('raw-via').value = '';
      loadAccounts();
    }

    async function clearAccounts() {
      if (!confirm("Bạn có chắc chắn muốn xóa toàn bộ danh sách nick?")) return;
      await fetch('/api/accounts/clear', { method: 'DELETE' });
      loadAccounts();
    }

    async function loadCampaign() {
      const res = await fetch('/api/campaign');
      const data = await res.json();
      if (data.target_url) document.getElementById('target-url').value = data.target_url;
      if (data.threads) document.getElementById('threads').value = data.threads;
      if (data.min_delay) document.getElementById('min-delay').value = data.min_delay;
      if (data.max_delay) document.getElementById('max-delay').value = data.max_delay;
      if (data.enable_reaction !== undefined) document.getElementById('enable-reaction').checked = data.enable_reaction;
      if (data.comments) document.getElementById('comments').value = data.comments.join('\n');
    }

    async function saveCampaign() {
      const payload = {
        target_url: document.getElementById('target-url').value.trim(),
        threads: parseInt(document.getElementById('threads').value),
        min_delay: parseInt(document.getElementById('min-delay').value),
        max_delay: parseInt(document.getElementById('max-delay').value),
        enable_reaction: document.getElementById('enable-reaction').checked,
        comments: document.getElementById('comments').value.split('\n').map(c => c.trim()).filter(c => c)
      };
      await fetch('/api/campaign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      alert("Đã lưu kịch bản chiến dịch thành công!");
    }

    async function startCampaign() {
      const btn = document.getElementById('btn-start');
      btn.disabled = true;
      btn.innerText = "Đang chạy...";
      try {
        const res = await fetch('/api/campaign/start', { method: 'POST' });
        const data = await res.json();
        if (res.status !== 200) {
          alert(data.message);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-play"></i> BẮT ĐẦU CHẠY';
        }
      } catch (e) {
        alert("Lỗi khi gửi lệnh bắt đầu: " + e);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-play"></i> BẮT ĐẦU CHẠY';
      }
    }

    async function pollLogs() {
      try {
        const res = await fetch('/api/logs');
        const data = await res.json();
        const box = document.getElementById('log-box');
        box.innerText = data.logs.join('\n');
        box.scrollTop = box.scrollHeight;

        const badge = document.getElementById('status-badge');
        const btn = document.getElementById('btn-start');
        if (data.is_running) {
          badge.className = "px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center gap-2";
          badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Đang chạy...';
          btn.disabled = true;
          btn.innerText = "ĐANG CHẠY...";
        } else {
          badge.className = "px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2";
          badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Sẵn sàng';
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-play"></i> BẮT ĐẦU CHẠY';
        }
      } catch (e) {}
    }

    window.onload = () => {
      loadAccounts();
      loadCampaign();
      setInterval(pollLogs, 1500);
    };
  </script>
</body>
</html>
